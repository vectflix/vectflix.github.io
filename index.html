<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vectflix</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

    <nav class="navbar">
      <div class="logo">Vectflix</div>
      <button class="sign-in-btn">Sign In</button>
    </nav>

    <div class="hero-content">
      <div class="featured-wrapper">
        <button class="featured-btn prev">&lt;</button>

        <a id="featured-link" class="featured-card" href="#" target="_blank">
          <img id="featured-image" src="" alt="Featured" />
          <div class="featured-info">
            <h1 id="featured-title">Featured Title</h1>
            <p id="featured-tagline">Featured tagline goes here.</p>
          </div>
        </a>

        <button class="featured-btn next">&gt;</button>
      </div>

      <p class="hero-text">
        Unlimited movies, series and more. Watch anywhere. Cancel anytime.
      </p>

      <form class="email-form">
        <input type="email" placeholder="Enter your email" required />
        <button type="submit">Get Started</button>
      </form>
    </div>
  </header>

  <!-- Search bar -->
  <div class="search-container">
    <input type="text" id="movie-search" placeholder="Search movies...">
  </div>

  <main>
    <!-- Series row -->
    <section class="row">
      <h3>Series</h3>
      <div class="scroll-container">
        <button class="scroll-btn left">&lt;</button>
        <div class="row-posters" id="series-row"></div>
        <button class="scroll-btn right">&gt;</button>
      </div>
    </section>

    <!-- Sci-Fi & Action row -->
    <section class="row">
      <h3>Sci-Fi &amp; Action</h3>
      <div class="scroll-container">
        <button class="scroll-btn left">&lt;</button>
        <div class="row-posters" id="scifi-row"></div>
        <button class="scroll-btn right">&gt;</button>
      </div>
    </section>

    <!-- Family & Animation row -->
    <section class="row">
      <h3>Family &amp; Animation</h3>
      <div class="scroll-container">
        <button class="scroll-btn left">&lt;</button>
        <div class="row-posters" id="family-row"></div>
        <button class="scroll-btn right">&gt;</button>
      </div>
    </section>

    <!-- Drama & Blockbusters row -->
    <section class="row">
      <h3>Drama &amp; Blockbusters</h3>
      <div class="scroll-container">
        <button class="scroll-btn left">&lt;</button>
        <div class="row-posters" id="drama-row"></div>
        <button class="scroll-btn right">&gt;</button>
      </div>
    </section>

    <!-- Anime row -->
    <section class="row">
      <h3>Anime</h3>
      <div class="scroll-container">
        <button class="scroll-btn left">&lt;</button>
        <div class="row-posters" id="anime-row"></div>
        <button class="scroll-btn right">&gt;</button>
      </div>
    </section>

    <!-- Horror row -->
    <section class="row">
      <h3>Horror</h3>
      <div class="scroll-container">
        <button class="scroll-btn left">&lt;</button>
        <div class="row-posters" id="horror-row"></div>
        <button class="scroll-btn right">&gt;</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Vectflix | <a href="https://Instagram.com/vecteezy_1" target="_blank">Instagram</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
