
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vectflix</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Top hero / landing section -->
  <header class="hero">
    <div class="overlay"></div>

    <nav class="navbar">
      <div class="logo">Vectflix</div>
      <button class="sign-in-btn">Sign In</button>
    </nav>

    <div class="hero-content">
      <h1>Unlimited movies, series and more.</h1>
      <h2>Watch anywhere. Cancel anytime.</h2>
      <p class="hero-text">
        Ready to watch? Enter your email to create or restart your membership.
      </p>

      <form class="email-form">
        <input type="email" placeholder="Enter your email" required />
        <button type="submit">Get Started</button>
      </form>
    </div>
  </header>

  <div class="search-container">
    <input type="text" id="movie-search" placeholder="Search movies...">
  </div>

  <main>
    <!-- Series row -->
    <section class="row">
      <h3>Series</h3>
      <div class="scroll-container">
        <button class="scroll-btn left">&lt;</button>
        <div class="row-posters" id="series-row"></div>
        <button class="scroll-btn right">&gt;</button>
      </div>
    </section>

    <!-- Sci-Fi & Action row -->
    <section class="row">
      <h3>Sci-Fi &amp; Action</h3>
      <div class="scroll-container">
        <button class="scroll-btn left">&lt;</button>
        <div class="row-posters" id="scifi-row"></div>
        <button class="scroll-btn right">&gt;</button>
      </div>
    </section>

    <!-- Family & Animation row -->
    <section class="row">
      <h3>Family &amp; Animation</h3>
      <div class="scroll-container">
        <button class="scroll-btn left">&lt;</button>
        <div class="row-posters" id="family-row"></div>
        <button class="scroll-btn right">&gt;</button>
      </div>
    </section>

    <!-- Drama & Blockbusters row -->
    <section class="row">
      <h3>Drama &amp; Blockbusters</h3>
      <div class="scroll-container">
        <button class="scroll-btn left">&lt;</button>
        <div class="row-posters" id="drama-row"></div>
        <button class="scroll-btn right">&gt;</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>Vectflix | <a href="https://Instagram.com/vecteezy_1" target="_blank">Instagram</a></p>
  </footer>

  <script src="script.js"></script>
  <script>
    // Scroll buttons functionality
    const scrollContainers = document.querySelectorAll(".scroll-container");
    scrollContainers.forEach(container => {
      const row = container.querySelector(".row-posters");
      const leftBtn = container.querySelector(".scroll-btn.left");
      const rightBtn = container.querySelector(".scroll-btn.right");

      leftBtn.addEventListener("click", () => {
        row.scrollBy({ left: -300, behavior: "smooth" });
      });
      rightBtn.addEventListener("click", () => {
        row.scrollBy({ left: 300, behavior: "smooth" });
      });
    });
  </script>
</body>
</html>
