<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLITZ SQUAD | OFFICIAL STORE</title>
    <style>
        /* BRAND DESIGN */
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            background-color: #000000; 
            color: #ffffff; 
        }
        
        header { 
            padding: 60px 20px; 
            text-align: center; 
            border-bottom: 1px solid #222; 
        }

        h1 { 
            font-size: 3rem; 
            letter-spacing: 10px; 
            margin: 0; 
            text-transform: uppercase; 
        }

        .tagline { 
            color: #666; 
            letter-spacing: 2px; 
            margin-top: 10px; 
        }

        /* PRODUCT GRID */
        .shop-container { 
            max-width: 1100px; 
            margin: 40px auto; 
            padding: 20px; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px; 
        }

        .product-card { 
            background: #0a0a0a; 
            border: 1px solid #1a1a1a; 
            padding: 20px; 
            text-align: center; 
            transition: 0.3s; 
        }

        .product-card:hover { 
            border-color: #fff; 
        }

        .product-card img { 
            width: 100%; 
            height: auto; 
            margin-bottom: 20px; 
            filter: grayscale(20%); 
        }

        .product-card h3 { 
            text-transform: uppercase; 
            margin: 10px 0; 
            letter-spacing: 1px; 
        }

        .price { 
            display: block; 
            color: #888; 
            margin-bottom: 20px; 
            font-size: 1.2rem; 
        }

        /* BUTTONS */
        .btn { 
            display: inline-block; 
            background: #fff; 
            color: #000; 
            padding: 12px 30px; 
            text-decoration: none; 
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 0.8rem; 
        }

        .btn:hover { 
            background: #ccc; 
        }

        footer { 
            padding: 50px; 
            text-align: center; 
            font-size: 0.8rem; 
            color: #444; 
        }
    </style>
</head>
<body>

    <header>
        <h1>BLITZ SQUAD</h1>
        <p class="tagline">PREMIUM STREETWEAR COLLECTIONS</p>
    </header>

    <div class="shop-container">
        
        <div class="product-card">
            <img src="images/black-tee.jpg" alt="Black Blitz Tee">
            <h3>Signature Tee (Black)</h3>
            <span class="price">$30.00</span>
            <a href="#" class="btn">Order via WhatsApp</a>
        </div>

        <div class="product-card">
            <img src="images/white-tee.jpg" alt="White Blitz Tee">
            <h3>Signature Tee (White)</h3>
            <span class="price">$30.00</span>
            <a href="#" class="btn">Order via WhatsApp</a>
        </div>

        <div class="product-card">
            <img src="images/black-hoodie.jpg" alt="Black Blitz Hoodie">
            <h3>Blitz Squad Hoodie</h3>
            <span class="price">$55.00</span>
            <a href="#" class="btn">Order via WhatsApp</a>
        </div>

    </div>

    <footer>
        &copy; 2025 BLITZ SQUAD. WORLDWIDE SHIPPING.
    </footer>

</body>
</html>
