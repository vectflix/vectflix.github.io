<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLITZ SQUAD | OFFICIAL STORE</title>
    <style>
        /* BRAND THEME */
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            margin: 0; 
            background-color: #000; 
            color: #fff; 
            text-align: center; 
        }
        
        header { 
            padding: 80px 20px; 
            border-bottom: 1px solid #222; 
        }

        h1 { 
            font-size: 3rem; 
            letter-spacing: 12px; 
            margin: 0; 
            text-transform: uppercase; 
        }

        .tagline { 
            color: #666; 
            letter-spacing: 3px; 
            margin-top: 15px; 
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        /* PRODUCT LAYOUT */
        .shop-container { 
            max-width: 1200px; 
            margin: 40px auto; 
            padding: 20px; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 40px; 
        }

        .product-card { 
            background: #050505; 
            border: 1px solid #111; 
            padding: 25px; 
            transition: all 0.4s ease; 
        }

        .product-card:hover { 
            border-color: #ffffff;
            transform: translateY(-5px);
        }

        .product-card img { 
            width: 100%; 
            height: auto; 
            margin-bottom: 25px; 
        }

        .product-card h3 { 
            text-transform: uppercase; 
            margin: 15px 0 5px; 
            letter-spacing: 2px; 
            font-size: 1.1rem;
        }

        .price { 
            display: block; 
            color: #888; 
            margin-bottom: 25px; 
            font-size: 1.1rem; 
            font-weight: bold;
        }

        /* ORDER BUTTON */
        .btn { 
            display: block; 
            background: #fff; 
            color: #000; 
            padding: 15px; 
            text-decoration: none; 
            font-weight: bold; 
            text-transform: uppercase; 
            font-size: 0.8rem; 
            letter-spacing: 1px;
        }

        .btn:hover { 
            background: #cccccc; 
        }

        footer { 
            padding: 80px 20px; 
            color: #333; 
            font-size: 0.7rem; 
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

        <h1>BLITZ SQUAD</h1>
        <p class="tagline">Engineered for the Street</p>
    </header>
